# ------------------------------------------------------------------ Plugin identity
# WARNING: pluginId is PERMANENT on JetBrains Marketplace: it cannot be changed after the first upload.
#    Use a domain you control (com.yourcompany.localpush) or io.github.<username>.localpush.
pluginId=CHANGE_ME.localpush
pluginGroup=com.localpush
# Max 30 characters; must not contain "Plugin", "IntelliJ", "JetBrains" or JetBrains product names.
pluginName=Local Push Mock
# SemVer. A -beta.N / -alpha.N suffix publishes to that Marketplace channel instead of "default".
pluginVersion=1.0.0

# Vendor: the Marketplace requires a valid, working email and website.
pluginVendorName=CHANGE_ME Your Company
pluginVendorEmail=CHANGE_ME@example.com
pluginVendorUrl=https://CHANGE_ME.example.com

# ------------------------------------------------------------------ Platform
# Compiled against IC 2024.2 (build 242 = base of Android Studio Ladybug). Only APIs from
# com.intellij.modules.platform are used: works in Android Studio Ladybug+ and in every JetBrains IDE.
platformType=IC
platformVersion=2024.2.5
pluginSinceBuild=242

# ------------------------------------------------------------------ Gradle
kotlin.stdlib.default.dependency=false
org.gradle.caching=true
